# Cloudflare Workers + D1 配置
# 站点：Astro 7 + @astrojs/cloudflare v14 —— 部署目标为 Workers（不再是 Pages）。
# 构建产物：dist/client（静态资源，经 ASSETS 绑定命中）+ dist/server（SSR Worker，动态路由回落）。
# 文档：https://docs.astro.build/en/guides/integrations-guide/cloudflare/

name = "dating-nav"
compatibility_date = "2025-08-05"

# 静态资源与 SSR Worker 共存：命中文件走 assets，未命中路由回落 Worker 按需渲染。
[assets]
directory = "./dist/client"
binding = "ASSETS"

# D1 数据库绑定（PRD §9, §41）
# 导入命令统一使用绑定名 DATING_DB：
#   本地测试：wrangler d1 execute DATING_DB --local  --file=migrations/0001_init.sql
#   生产环境：wrangler d1 execute DATING_DB --remote --file=import.sql
# 部署前：npx wrangler d1 create dating-nav 并填写下方 database_id
[[d1_databases]]
binding = "DATING_DB"
database_name = "dating-nav"
database_id = "ce20917f-f107-43b0-a03a-0148578638bc"
migrations_dir = "migrations"

# 部署命令：
#   pnpm deploy        构建并部署（默认分支）
#   pnpm deploy:prod   构建并部署到生产分支（main）

# Cloudflare Pages + D1 配置
# 文档：https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "hot-video"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-05"

# D1 数据库绑定（PRD §15-17, §22-23, §39）
# 导入命令统一使用绑定名 VIDEO_DB：
#   本地测试：wrangler d1 execute VIDEO_DB --local  --file=schema.sql
#   生产环境：wrangler d1 execute VIDEO_DB --remote --file=schema.sql
# 部署前：npx wrangler d1 create hot-video 并填写下方 database_id
[[d1_databases]]
binding = "VIDEO_DB"
database_name = "hot-video"
database_id = "ff8107e2-1457-4e22-8330-34fa26fc5be3"
migrations_dir = "migrations"

# 部署命令：
#   pnpm deploy        构建并部署（默认分支）
#   pnpm deploy:prod   构建并部署到生产分支（main）
